<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Message Sent - Rafael Laidlaw</title>
  <link rel="icon" type="image/svg+xml" href="/usb.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Ubuntu', sans-serif;
      background: #ededed;
      color: #55575b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wrapper {
      max-width: 420px;
      margin: 0 auto;
      text-align: center;
      padding: 2rem;
    }
    .icon {
      width: 64px;
      height: 64px;
      background: #d1fae5;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
    }
    .icon svg {
      width: 32px;
      height: 32px;
      color: #16a34a;
    }
    h1 {
      font-size: 1.75rem;
      margin-bottom: 1rem;
    }
    p {
      color: #888a8f;
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }
    a.back {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: #55575b;
      color: #fff;
      border-radius: 0.375rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s;
    }
    a.back:hover {
      background: #333;
    }
    .links {
      margin-top: 1.5rem;
      font-size: 0.875rem;
    }
    .links a {
      color: #55575b;
      text-decoration: underline;
      margin: 0 0.5rem;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="icon">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
      </svg>
    </div>
    <h1>Message Sent!</h1>
    <p>Thank you for reaching out! I've received your message and will get back to you as soon as possible.</p>
    <a href="/noscript/" class="back">Back to Portfolio</a>
    <div class="links">
      <a href="https://github.com/rafalaidlaw" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a href="https://www.linkedin.com/in/rafalaidlaw/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
    </div>
  </div>
</body>
</html>
